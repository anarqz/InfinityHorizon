[package]
name = "fi-crash-service"
version = "0.0.0"
description = "Consented crash metadata intake, diagnostic triage and audited human moderation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
fi-surfaces = { path = "../../crates/fi-surfaces" }
fi-auth = { path = "../../crates/fi-auth" }
fi-crash = { path = "../../crates/fi-crash" }
fi-db = { path = "../../crates/fi-db" }
fi-protocol = { path = "../../crates/fi-protocol" }
fi-runtime = { path = "../../crates/fi-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "=0.5.3", features = ["limit", "util"] }
uuid = { version = "=1.28.0", features = ["v7"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
futures-util = "=0.3.34"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
time = "=0.3.55"
fi-domain = { path = "../../crates/fi-domain" }
