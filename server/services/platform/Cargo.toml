# fi-platform: one binary for the three public APIs of ADR 0023 (OD-122). `FI_SURFACES` selects
# what a process mounts: `infinity` (fi-core, fi-gate and fi-crash surfaces), `game` (the game
# plane, the Supporters' universe and matchmaking, the proxied game requests picked by the
# ticket's pool) and `progression` (the save line); `all` for a standalone instance.
[package]
name = "fi-platform"
version = "0.0.0"
description = "ForzaInfinity platform: fi-infinity, fi-game and fi-progression from one binary (ADR 0023)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "tracing"] }
fi-surfaces = { path = "../../crates/fi-surfaces" }
# The beholder announcer (ANNOUNCER_API.md, CR-S54; on only with FI_BEHOLDER_URL).
fi-announce = { path = "../../crates/fi-announce" }
fi-auth = { path = "../../crates/fi-auth" }
fi-core = { path = "../core" }
fi-crash-service = { path = "../crash" }
fi-db = { path = "../../crates/fi-db" }
fi-gate = { path = "../gate" }
fi-matchmaking = { path = "../matchmaking" }
fi-protocol = { path = "../../crates/fi-protocol" }
fi-runtime = { path = "../../crates/fi-runtime" }
fi-saves-service = { path = "../saves" }
# `accounts import-firebase`: reads a Firebase Authentication export (JSON).
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"

[dev-dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
