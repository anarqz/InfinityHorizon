# fi-saves-service: the platform v1 saves deployable (ADR 0013, 0016; UNIVERSE_API.md). Mounts
# fi-api's save line (`/launcher/v1/profiles/{xuid}/save*`, platform session) and game plane
# (`/game/v1`, ticket) and serves `/saves/v1` (the Supporters' universe) behind the game access
# ticket, verify-only (public keys; the gate's private key is never configured here). The crate
# name `fi-saves` belongs to the save core.
[package]
name = "fi-saves-service"
version = "0.0.0"
description = "ForzaInfinity saves service: the save line, the game plane and the Supporters' universe behind the game access ticket."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "tracing"] }
fi-surfaces = { path = "../../crates/fi-surfaces" }
fi-auth = { path = "../../crates/fi-auth" }
fi-db = { path = "../../crates/fi-db" }
fi-domain = { path = "../../crates/fi-domain" }
fi-protocol = { path = "../../crates/fi-protocol" }
fi-runtime = { path = "../../crates/fi-runtime" }
fi-saves = { path = "../../crates/fi-saves" }
fi-storage = { path = "../../crates/fi-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.28.0", features = ["v5", "v7"] }

[dev-dependencies]
# FH2's level curve and the guardrails' rates for the RPC gates' tests (tests/gates.rs, OD-62).
fi-gamedb = { path = "../../crates/fi-gamedb" }
fi-guard = { path = "../../crates/fi-guard" }
# Synthetic bin/xtsw bodies for the proxied Forza RPC tests (tests/gameplane.rs).
fi-xtsw = { path = "../../crates/fi-xtsw" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time"] }
time = "=0.3.55"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
