# fi-announce: a node's side of the beholder (docs/contracts/ANNOUNCER_API.md, CR-S54). Builds and
# signs the announce body with the node's own Ed25519 key and posts it every 30 s; fi-platform and
# fi-relay-vm run it when FI_BEHOLDER_URL is set. No account-plane code: the relay links it too.
[package]
name = "fi-announce"
version = "0.0.0"
description = "ForzaInfinity node announcer: signed announces of servers and relays to the beholder."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fi-protocol = { path = "../fi-protocol" }
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["time", "macros"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
