# Shared plumbing of every backend service (ADR 0002 §4, ADR 0010): environment configuration,
# structured logs in Cloud Logging's JSON shape with trace correlation, request context, health
# endpoints and graceful shutdown on Cloud Run's SIGTERM.
[package]
name = "fi-runtime"
version = "0.0.0"
description = "ForzaInfinity service runtime: env config, Cloud Logging JSON logs, request context, health routes, graceful shutdown."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path", "tracing"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "registry", "env-filter", "json"] }
uuid = { version = "=1.28.0", features = ["v7"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
