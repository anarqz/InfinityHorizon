# Pure identity and routing rules shared by every server crate, the launcher and the tools (ADR 0006).
# Leaf crate: no internal dependency, no I/O, no clock (callers pass `now`).
[package]
name = "fi-domain"
version = "0.0.0"
description = "ForzaInfinity identity value types: ids, XUIDs, gamertags, site keys, profile modes, tiers and pool routing."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Exact pins (the porthub saveExact rule); versions match the other workspace crates.
getrandom = "=0.4.3"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
