[package]
name = "dedicated-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Infinity world server: the world engine for private (launcher) and public (relay VM) worlds"
publish = false

# A standalone crate with its own workspace (not part of any other workspace).
[workspace]

[lib]
name = "dedicated_server"
path = "src/lib.rs"

[[bin]]
name = "dedicated-server"
path = "src/main.rs"

[features]
default = []
# Adds the `debug.fault` control op that panics inside a world on purpose, for the fault-isolation
# checks. Never enabled in a release build.
test-hooks = []

# Exact pins. serde_json is the only dependency (the control channel's JSON); no C code, so the
# Windows build needs no C toolchain.
[dependencies]
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "unwind" (the default) is required: a world's fault boundary catches its panics.
panic = "unwind"
